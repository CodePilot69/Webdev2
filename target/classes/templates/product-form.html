<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Add Product</title>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <h2>Add New Product</h2>

    <form th:action="@{/products}" th:object="${product}" method="post">

        <div>
            <label for="name">Product Name</label><br/>
            <input type="text" id="name" th:field="*{name}" placeholder="e.g. Monitor"/>
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <br/>
        <div>
            <label for="price">Price (PHP)</label><br/>
            <input type="text" id="price" th:field="*{price}" placeholder="e.g. 5000"/>
            <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
        </div>
        <br/>
        <button type="submit">Save Product</button>
    </form>

    <br/>
    <a th:href="@{/products}">Back to list</a>

</body>
</html>
