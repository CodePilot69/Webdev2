<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Products</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f6fa; }
        .container { max-width: 800px; margin: 32px auto; padding: 0 16px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        th { background: #2c3e50; color: #fff; padding: 12px 16px; text-align: left; }
        td { padding: 12px 16px; border-bottom: 1px solid #eee; }
        tr:last-child td { border-bottom: none; }
        a.btn { display: inline-block; margin-top: 16px; padding: 10px 20px; background: #2c3e50; color: #fff; text-decoration: none; border-radius: 4px; }
        .empty { color: #888; font-style: italic; margin-top: 24px; }
    </style>
</head>
<body>

    <!-- Task 3 — include shared navbar fragment via th:replace -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <h1>Product List</h1>

        <!-- Task 4 — link to create form -->
        <a class="btn" th:href="@{/products/new}">+ Add Product</a>

        <!-- Task 1 — th:if: show message only when list is empty -->
        <p class="empty" th:if="${#lists.isEmpty(products)}">
            No products available. Add one above!
        </p>

        <!-- Task 1 — th:each iterates the list; th:text renders each field -->
        <table th:if="${!#lists.isEmpty(products)}">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Price (PHP)</th>
                    <th>Category</th>
                    <th>Detail</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}">1</td>
                    <td th:text="${product.name}">Product Name</td>
                    <td th:text="${product.price}">0.00</td>
                    <td th:text="${product.category.name}">Category</td>
                    <td>
                        <a th:href="@{/products/{id}(id=${product.id})}">View</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
