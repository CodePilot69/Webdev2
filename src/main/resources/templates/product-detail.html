<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Product Detail</title>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <h2>Product Detail</h2>

    <p><strong>ID:</strong> <span th:text="${product.id}">0</span></p>
    <p><strong>Name:</strong> <span th:text="${product.name}">Product Name</span></p>
    <p><strong>Price:</strong> <span th:text="${'PHP ' + product.price}">PHP 0.00</span></p>
    <p><strong>Category:</strong> <span th:text="${product.category.name}">Category</span></p>

    <a th:href="@{/products}">Back to list</a>

</body>
</html>
