<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Add Book</title>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <h2>Add New Book</h2>

    <form th:action="@{/books}" th:object="${book}" method="post">

        <div>
            <label for="title">Title</label><br/>
            <input type="text" id="title" th:field="*{title}" placeholder="e.g. Clean Code"/>
            <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
        </div>
        <br/>
        <div>
            <label for="author">Author</label><br/>
            <input type="text" id="author" th:field="*{author}" placeholder="e.g. Robert C. Martin"/>
            <span th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
        </div>
        <br/>
        <div>
            <label for="isbn">ISBN (13 digits)</label><br/>
            <input type="text" id="isbn" th:field="*{isbn}" placeholder="e.g. 9780132350884"/>
            <span th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></span>
        </div>
        <br/>
        <div>
            <label for="year">Publication Year</label><br/>
            <input type="number" id="year" th:field="*{year}" placeholder="e.g. 2024"/>
            <span th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></span>
        </div>
        <br/>
        <button type="submit">Save Book</button>
    </form>

    <br/>
    <a th:href="@{/books}">Back to list</a>

</body>
</html>
