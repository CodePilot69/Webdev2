<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Products</title>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <h1>Product List</h1>

    <a th:href="@{/products/new}">+ Add Product</a>

    <p th:if="${#lists.isEmpty(products)}">
        No products available. Add one above!
    </p>

    <table border="1" th:if="${!#lists.isEmpty(products)}">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price (PHP)</th>
                <th>Category</th>
                <th>Detail</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td th:text="${product.name}">Product Name</td>
                <td th:text="${product.price}">0.00</td>
                <td th:text="${product.category.name}">Category</td>
                <td>
                    <a th:href="@{/products/{id}(id=${product.id})}">View</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
