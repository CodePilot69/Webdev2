<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Edit Book</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background: #f0f2f5; }
        .container { max-width: 520px; margin: 32px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0,0,0,.1); padding: 28px; }
        h2 { margin-top: 0; color: #1a252f; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; }
        input[type=text], input[type=number] {
            width: 100%; padding: 9px 11px; border: 1px solid #ccc;
            border-radius: 4px; font-size: 1rem; }
        input.error-field { border-color: #e74c3c; }
        .error { color: #e74c3c; font-size: .83rem; margin-top: 4px; }
        .btn-submit { padding: 10px 26px; background: #2980b9; color: #fff;
                      border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        a.back { display: inline-block; margin-top: 14px; color: #1a252f; }
    </style>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <div class="card">
            <h2>Edit Book</h2>

            <!--
                POST to /books/{id} — Spring MVC maps this to the update handler.
                th:object binds to the pre-populated Book from the model.
            -->
            <form th:action="@{/books/{id}(id=${book.id})}"
                  th:object="${book}" method="post">

                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" th:field="*{title}"
                           th:classappend="${#fields.hasErrors('title')} ? 'error-field'"/>
                    <span class="error" th:if="${#fields.hasErrors('title')}"
                          th:errors="*{title}">Title error</span>
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" th:field="*{author}"
                           th:classappend="${#fields.hasErrors('author')} ? 'error-field'"/>
                    <span class="error" th:if="${#fields.hasErrors('author')}"
                          th:errors="*{author}">Author error</span>
                </div>

                <div class="form-group">
                    <label for="isbn">ISBN (13 digits)</label>
                    <input type="text" id="isbn" th:field="*{isbn}"
                           th:classappend="${#fields.hasErrors('isbn')} ? 'error-field'"/>
                    <span class="error" th:if="${#fields.hasErrors('isbn')}"
                          th:errors="*{isbn}">ISBN error</span>
                </div>

                <div class="form-group">
                    <label for="year">Publication Year</label>
                    <input type="number" id="year" th:field="*{year}"
                           th:classappend="${#fields.hasErrors('year')} ? 'error-field'"/>
                    <span class="error" th:if="${#fields.hasErrors('year')}"
                          th:errors="*{year}">Year error</span>
                </div>

                <button class="btn-submit" type="submit">Update Book</button>
            </form>

            <a class="back" th:href="@{/books}">← Back to list</a>
        </div>
    </div>

</body>
</html>
