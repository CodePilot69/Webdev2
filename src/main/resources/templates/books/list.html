<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Book Library</title>
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <h1>Book Library</h1>

    <a th:href="@{/books/new}">+ Add New Book</a>

    <p th:if="${#lists.isEmpty(books)}">
        No books in the library yet. Add one above!
    </p>

    <table th:if="${!#lists.isEmpty(books)}">
        <thead>
            <tr>
                <th>#</th>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Year</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}">1</td>
                <td th:text="${book.title}">Title</td>
                <td th:text="${book.author}">Author</td>
                <td th:text="${book.isbn}">ISBN</td>
                <td th:text="${book.year}">2024</td>
                <td>
                    <a th:href="@{/books/{id}/edit(id=${book.id})}">Edit</a>
                    |
                    <form th:action="@{/books/{id}/delete(id=${book.id})}"
                          method="post" style="display:inline"
                          onsubmit="return confirm('Delete this book?')">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
