<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Product Detail</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f6fa; }
        .container { max-width: 600px; margin: 32px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 24px; }
        .card h2 { margin-top: 0; color: #2c3e50; }
        .field { margin-bottom: 12px; }
        .label { font-weight: bold; color: #555; width: 120px; display: inline-block; }
        a.back { display: inline-block; margin-top: 16px; color: #2c3e50; }
    </style>
</head>
<body>

    <!-- Task 3 — same navbar fragment via th:replace -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">
        <div class="card">
            <h2>Product Detail</h2>

            <!-- Task 2 — variable expressions: ${product.name}, ${product.price} -->
            <div class="field">
                <span class="label">ID:</span>
                <span th:text="${product.id}">0</span>
            </div>
            <div class="field">
                <span class="label">Name:</span>
                <span th:text="${product.name}">Product Name</span>
            </div>
            <div class="field">
                <span class="label">Price:</span>
                <span th:text="${'PHP ' + product.price}">PHP 0.00</span>
            </div>
            <!-- Task 2 — nested property access: product.category.name -->
            <div class="field">
                <span class="label">Category:</span>
                <span th:text="${product.category.name}">Category</span>
            </div>

            <a class="back" th:href="@{/products}">← Back to list</a>
        </div>
    </div>

</body>
</html>
